name: dev and Main Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build-and-run-dev:
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.DEV_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.DEV_POSTGRES_PORT }}
      ConnectionStrings:Database: ${{secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION}}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start containers from root compose
        working-directory: start/development
        run: docker compose -f docker-compose.development.yml up -d --build

      - name: Build .NET application
        working-directory: app/api/Qwizzi/src/Qwizzi.Api
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Run .NET application
        working-directory: app/api/Qwizzi/src/Qwizzi.Api
        run: |
          dotnet run --configuration Release &
          sleep 20

      - name: Build and run React application
        working-directory: app/client/Qwizzi
        run: |
          npm ci
          npm run build

      - name: Show running containers
        working-directory: start/development
        run: docker compose -f docker-compose.development.yml ps

  build-and-run-main:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.STAGE_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.STAGE_POSTGRES_PASSWORD }}
      POSTGRES_PORT: ${{ secrets.STAGE_POSTGRES_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start staging stack
        working-directory: start/staging
        run: docker compose -f docker-compose.staging.yml up -d --build

      - name: Show running production containers
        working-directory: start/staging
        run: docker compose -f docker-compose.staging.yml ps
