# This file contains the docker-compose configuration for the staging environment of the Qwizzi application.
name: qwizzi-staging

services:
  postgres-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qwizzi
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - qwizzi_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  client-app:
    build:
      context: ./app/client/qwizzi
      dockerfile: Dockerfile
    depends_on:
      - postgres-db
    ports:
      - '8081:5173'

volumes:
  qwizzi_postgres_staging_data:
